[package]
name = "duckhive-ide"
version = "0.1.0"
edition = "2021"
authors = ["DuckHive Team"]
license = "MIT"
description = "AI-First IDE for Vibe Coding"

[lib]
name = "duckhive_ide"
path = "src/lib.rs"

[[bin]]
name = "duckhive-ide"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.0", features = ["shell-open"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"